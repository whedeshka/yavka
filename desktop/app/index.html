<script>
let NAMES=["Студент 1","Студент 2","Студент 3"];
const KEY="attendance-26l02-oct-v2";
const TYPES={lec:"лекция",sem:"семинар",unk:"тип не указан"};
const ST={u:"неуважительно",e:"уважительно"};
let S={recs:[],uid:1};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const ui={tab:"mark",scheduleDay:1,scheduleWeek:0,editSlot:-1,date:iso(new Date()),ym:iso(new Date()).slice(0,7),detail:null,slots:[],min:15,type:"lec",subject:"",pairs:1,marks:{},open:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dstr=d=>new Date(d+"T00:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"short",year:"numeric"}).replace(" г.","");

function seed(){return {recs:[],uid:1,names:NAMES}}
function load(){try{const j=localStorage.getItem(KEY);if(j){S=JSON.parse(j);if(Array.isArray(S.schedule)&&S.schedule.length===2)SCH=S.schedule;if(S.names&&S.names.length)NAMES=S.names;if(S.cfg)CFG={...CFG,group:S.cfg.group||CFG.group,course:S.cfg.course||CFG.course,spec:S.cfg.spec||CFG.spec,w1:(S.cfg.w1==="2026-08-31"?"2026-09-01":(S.cfg.w1||CFG.w1))};delete S.homework;delete S.journal;delete S.sess;delete S.daySess;S.cfg=CFG;S.recs.forEach(x=>{if(!x.date)x.date="2026-10-"+String(x.day).padStart(2,"0");if(x.status==="?")x.status="u"});return}}catch(e){}S=seed()}
function save(){try{S.schedule=SCH;delete S.homework;delete S.journal;delete S.sess;delete S.daySess;S.cfg={group:CFG.group,course:CFG.course,spec:CFG.spec,w1:CFG.w1};localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
function sums(i,ym=ui.ym){const allRec=S.recs.filter(x=>x.i===i&&(!ym||x.date.startsWith(ym)));const r=allRec.filter(x=>x.status!=="p");const h=s=>r.filter(x=>x.status===s).reduce((a,x)=>a+x.hours,0);const present=allRec.filter(x=>x.status==="p").reduce((a,x)=>a+x.hours,0);return {r:r.sort((a,b)=>a.date.localeCompare(b.date)),all:r.reduce((a,x)=>a+x.hours,0),present,u:h("u")+h("?"),e:h("e")}}
const TIMES=["8:30–10:05","10:30–12:05","13:00–14:35","15:00–16:35"],DOW=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
let SCH=[
{1:["Физкультура","!Анатомия|2С","История России","Философия"],2:["Основы искусственного интеллекта","Основы искусственного интеллекта","Нормальная физиология","Нормальная физиология"],3:["","!Молекулярная биология|4","Латинский язык",""],4:["!Уход за больными|4","!Биология|5","Анатомия","Анатомия"],5:["!История России|4","!Основы Российской государственности|4","Биология","Биология"],6:["Молекулярная биология","Молекулярная биология","Основы Российской государственности",""]},
{1:["Физкультура","История России","Основы Российской государственности",""],2:["","Философия","Латинский язык",""],3:["Молекулярная биология","Молекулярная биология","!Молекулярная биология|5","!Основы Российской государственности|4"],4:["Основы Российской государственности","Философия","Анатомия","Анатомия"],5:["!Нормальная физиология|6","!Основы искусственного интеллекта|4","Уход за больными","Уход за больными"],6:["","!Философия|4","",""]}];
function parseSlot(s){const lecture=s[0]==="!",[name,room]=s.replace(/^!/,"").split("|");return {name,room,sem:!lecture}}
function weekOf(ds){const [y,m,d]=ds.split("-").map(Number),[a,b,c]=CFG.w1.split("-").map(Number);const anchor=Date.UTC(a,b-1,c),date=Date.UTC(y,m-1,d),anchorMon=anchor-((new Date(anchor).getUTCDay()+6)%7)*864e5,dateMon=date-((new Date(date).getUTCDay()+6)%7)*864e5,df=Math.floor((dateMon-anchorMon)/864e5);return ((Math.floor(df/7)%2)+2)%2}
function dowOf(ds){const [y,m,d]=ds.split("-").map(Number);return new Date(Date.UTC(y,m-1,d)).getUTCDay()}
function dayOf(){return ui.date?(SCH[weekOf(ui.date)][dowOf(ui.date)]||[]):[]}
function viewToday(){
  const ds=iso(new Date()),dow=dowOf(ds),week=weekOf(ds),day=SCH[week][dow]||[];
  const title=`<div class="panel"><div class="hint" style="margin:0">${dstr(ds)} · ${week+1} учебная неделя</div><h2 style="margin:5px 0 0;text-transform:capitalize">${DOW[dow]}</h2></div>`;
  if(!day.some(Boolean))return title+`<div class="empty">Сегодня занятий нет 🎉</div>`;
  return title+`<div class="hint" style="margin:10px 2px">Нажми на пару — предмет и тип занятия автоматически подставятся в форму отметки.</div><div class="slots">`+day.map((s,k)=>{if(!s)return "";const p=parseSlot(s);return `<button class="slot" data-act="todaySlot" data-k="${k}"><b>${k+1} пара · ${TIMES[k]}</b><span>${esc(p.name)}${p.room?" · каб. "+esc(p.room):""} · ${p.sem?"семинар":"лекция"}</span><small style="display:block;color:var(--ac);margin-top:5px">Нажми, чтобы отметить посещаемость →</small></button>`}).join("")+`</div>`;
}
function schedHtml(){
  if(!ui.date)return "";
  const day=dayOf(),head=`<div class="hint" style="margin-bottom:6px">Расписание: ${weekOf(ui.date)+1} неделя · ${DOW[dowOf(ui.date)]}. Нажмите на пару (подряд идущие пары одного предмета можно выбрать вместе).</div>`;
  if(!day.some(Boolean))return head+`<div class="empty">В этот день пар нет, можно заполнить вручную.</div>`;
  return head+`<div class="slots">`+day.map((s,k)=>{if(!s)return "";const p=parseSlot(s);return `<button class="slot ${ui.slots.includes(k)?"on":""}" data-act="slot" data-k="${k}"><b>${k+1} пара · ${TIMES[k]}</b><span>${esc(p.name)}${p.room?" · каб. "+esc(p.room):""} · ${p.sem?"семинар":"лекция"}</span></button>`}).join("")+`</div>`;
}
function loadMarks(){ui.marks={};const sub=ui.subject.trim().toLowerCase();S.recs.forEach(x=>{if(x.date===ui.date&&x.type===ui.type&&x.subject.toLowerCase()===sub&&(x.sl||"")===ui.slots.join(",")){ui.marks[x.i]=x.status;ui.pairs=Math.max(1,Math.min(4,x.hours/2))}})}
const pairsWord=n=>{const m=n%10,c=n%100;return n+" "+(m===1&&c!==11?"пара":(m>=2&&m<=4&&(c<12||c>14)?"пары":"пар"))};
function recLine(x){return "  • "+dstr(x.date)+", "+TYPES[x.type]+", "+(x.subject||"предмет не указан")+" — "+x.hours+" ч ("+pairsWord(x.hours/2)+"), "+ST[x.status]+(x.note?" — "+x.note:"")}
function textFor(i){
  const s=sums(i);
  let t=NAMES[i]+" — "+periodLabel()+"\nПропущено: "+s.all+" ч ("+pairsWord(s.all/2)+")";
  if(s.all){t+="\nуважительно: "+s.e+" ч, неуважительно: "+s.u+" ч\n"+s.r.map(recLine).join("\n")}
  return t;
}
function textAll(){
  const tot=NAMES.reduce((a,_,i)=>a+sums(i).all,0);
  let t="Явка, группа "+CFG.group+", "+periodLabel()+"\nВсего пропущено: "+tot+" ч ("+pairsWord(tot/2)+"). 1 пара = 2 академических часа.\n";
  NAMES.forEach((_,i)=>{if(sums(i).all)t+="\n"+textFor(i)+"\n"});
  const clean=NAMES.filter((_,i)=>!sums(i).all);
  if(clean.length)t+="\nБез пропусков: "+clean.join(", ");
  return t.trim();
}

let CFG={spec:"31.05.01 «Лечебное дело»",course:"1",group:"26л-02",w1:"2026-09-01"};const MN=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const b64=buf=>{let s="";const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
async function buildXlsx(months,idx){
  const wb=new ExcelJS.Workbook(),th={style:"thin"},bd={top:th,left:th,bottom:th,right:th},ct={horizontal:"center",vertical:"middle",wrapText:true};
  const col=n=>{let s="";while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26}return s};
  months.forEach(ym=>{
    const [y,m]=ym.split("-").map(Number),ws=wb.addWorksheet("Ведомость "+ym);
    ws.mergeCells("A1:AJ1");const h=ws.getCell("A1");h.value="ВЕДОМОСТЬ УЧЕТА ПОСЕЩАЕМОСТИ ЛЕКЦИОННЫХ И ПРАКТИЧЕСКИХ ЗАНЯТИЙ";h.font={bold:true,size:13};h.alignment=ct;
    [["B3","Специальность"],["C3",CFG.spec],["O3",CFG.course],["P3","курс"],["R3",CFG.group],["T3","группа"],["W3","за"],["X3",MN[m-1].toUpperCase()],["AC3",(m>=9?y:y-1)+"-"+(m>=9?y+1:y)]].forEach(([a,v])=>ws.getCell(a).value=v);
    ws.mergeCells("A5:A6");ws.mergeCells("B5:B6");ws.mergeCells("C5:AG5");ws.mergeCells("AH5:AH6");ws.mergeCells("AI5:AJ5");
    ws.getCell("A5").value="№ п/п";ws.getCell("B5").value="ФИО учащихся";ws.getCell("C5").value="Числа месяца";ws.getCell("AH5").value="Итого";ws.getCell("AI5").value="Из них по причинам";ws.getCell("AI6").value="уваж.";ws.getCell("AJ6").value="неуваж.";
    for(let d=1;d<=31;d++)ws.getCell(6,2+d).value=d;
    idx.forEach((i,k)=>{
      const r=7+k,rc=S.recs.filter(x=>x.i===i&&x.date.startsWith(ym)&&x.status!=="p"),days={};
      rc.forEach(x=>{const d=+x.date.slice(8);(days[d]=days[d]||{lec:0,sem:0,unk:0})[x.type]+=x.hours});
      ws.getCell(r,1).value=k+1;ws.getCell(r,2).value=NAMES[i];
      Object.entries(days).forEach(([d,v])=>{ws.getCell(r,2+ +d).value=(v.lec||v.sem)?v.lec+"/"+v.sem+(v.unk?"+"+v.unk:""):String(v.unk)});

      if(tot){ws.getCell(r,34).value=tot;ws.getCell(r,35).value=sm("e")||null;ws.getCell(r,36).value=sm("u")||null}
    });

    ws.getColumn(1).width=6;ws.getColumn(2).width=36;for(let c=3;c<=33;c++)ws.getColumn(c).width=5.5;ws.getColumn(34).width=8;ws.getColumn(35).width=8;ws.getColumn(36).width=10;
    ws.getCell("B"+(end+2)).value=CFG.head?"Староста: "+CFG.head:"Староста";if(CFG.org){ws.mergeCells("A2:AJ2");const o=ws.getCell("A2");o.value=CFG.org;o.alignment=ct}
    ws.mergeCells("B"+(end+4)+":AI"+(end+4));const n=ws.getCell("B"+(end+4));n.alignment={wrapText:true,vertical:"top"};ws.getRow(end+4).height=48;
    n.value="Примечание: указывается количество пропусков в часах (одна пара — 2 академических часа). Пропуски лекций и практических занятий через дробь, например 2/4: первая цифра — часы лекций, вторая — часы практических занятий.";
    ws.views=[{state:"frozen",xSplit:2,ySplit:6}];ws.pageSetup={orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0};
  });
  const dt=wb.addWorksheet("Подробно");
  dt.addRow(["ФИО","Дата","Вид занятия","Предмет","Часы","Пар","Причина"]).font={bold:true};
  idx.forEach(i=>S.recs.filter(x=>x.i===i&&months.includes(x.date.slice(0,7))&&x.status!=="p").sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>dt.addRow([NAMES[i],dstr(x.date),TYPES[x.type],x.subject||"не указан",x.hours,x.hours/2,ST[x.status]])));

}
async function shareXlsx(idx,label){
  try{
    if(!window.ExcelJS){toast("Библиотека Excel не загрузилась");return false}
    let months=ui.ym?[ui.ym]:[...new Set(S.recs.filter(x=>idx.includes(x.i)).map(x=>x.date.slice(0,7)))].sort();
    if(!months.length)months=[ui.ym||iso(new Date()).slice(0,7)];
    const buf=await buildXlsx(months,idx),fname=("Явка_"+label+"_"+(ui.ym||"все_месяцы")+".xlsx").replace(/\s+/g,"_"),P=window.Capacitor&&window.Capacitor.Plugins;
    if(P&&P.Filesystem&&P.Share){const w=await P.Filesystem.writeFile({path:fname,data:b64(buf),directory:"CACHE"});await P.Share.share({title:fname,files:[w.uri],dialogTitle:"Поделиться таблицей"});return true}
    const f=new File([buf],fname,{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});

function attendancePlannedPairs(){
  const today=iso(new Date());
  let start,end;
  if(ui.ym){
    const [y,m]=ui.ym.split("-").map(Number);
    start=ui.ym+"-01";
    end=iso(new Date(Date.UTC(y,m,0)));
    if(end>today)end=today;
  }else{
    start=CFG.w1;
    end=today;
  }
  if(start>end)return 0;
  const a=new Date(start+"T00:00:00Z"),b=new Date(end+"T00:00:00Z");
  let count=0;
  for(let d=new Date(a);d<=b;d.setUTCDate(d.getUTCDate()+1)){
    const ds=d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");

}

  else if(a==="allHere"){ui.marks={};syncAttendanceUI();return}
  else if(a==="saveCfg"){CFG={group:$("#cg").value.trim()||"—",course:$("#cc").value.trim(),spec:$("#cs").value.trim(),w1:$("#cw").value||CFG.w1};S.cfg=CFG;save();toast("Настройки сохранены")}
  else if(a==="saveNames"){const nn=$("#gn").value.split("\n").map(s=>s.trim()).filter(Boolean);if(!nn.length){toast("Список пуст");return}const map=NAMES.map(n=>nn.indexOf(n));const lost=S.recs.filter(x=>map[x.i]<0).length;if(lost&&!confirm("Будет удалено записей о пропусках: "+lost+". Продолжить?"))return;S.recs=S.recs.filter(x=>map[x.i]>=0).map(x=>({...x,i:map[x.i]}));NAMES=nn;S.names=nn;ui.marks={};save();toast("Список сохранён")}
  else if(a==="clearAll"){if(confirm("Удалить все записи о пропусках?")){S.recs=[];ui.marks={};save();toast("Очищено")}}
  else if(a==="saveMarks"){
    const sub=ui.subject.trim(),n=Object.keys(ui.marks).length;
    
    S.recs=S.recs.filter(x=>!(x.date===ui.date&&x.type===ui.type&&x.subject.toLowerCase()===sub.toLowerCase()&&(x.sl||"")===ui.slots.join(",")));
    Object.entries(ui.marks).forEach(([k,st])=>S.recs.push({id:S.uid++,i:+k,date:ui.date,type:ui.type,subject:sub,sl:ui.slots.join(","),hours:ui.pairs*2,status:st}));
    save();toast("Сохранено. Отсутствуют: "+n);burst();return;
  }
  else if(a==="open"){ui.detail=i;scrollTo(0,0)}
  else if(a==="back"){ui.detail=null}
  else if(a==="pm"||a==="nm"){const [y,m]=(ui.ym||iso(new Date()).slice(0,7)).split("-").map(Number);ui.ym=iso(new Date(y,m-1+(a==="nm"?1:-1),1)).slice(0,7)}
  else if(a==="allp"){ui.ym=ui.ym?"":iso(new Date()).slice(0,7)}
  else if(a==="rtype"){r.type=r.type==="lec"?"sem":"lec";save()}
  else if(a==="rstat"){r.status=r.status==="u"?"e":"u";save()}
  else if(a==="rdel"){S.recs=S.recs.filter(x=>x.id!==id);save()}
  else if(a==="shareOne"){shareXlsx([i],NAMES[i].split(" ")[0]).then(ok=>{if(!ok)share(textFor(i),NAMES[i])});return}
  else if(a==="shareAll"){shareXlsx(NAMES.map((_,k)=>k),CFG.group).then(ok=>{if(!ok)share(textAll(),"Явка "+CFG.group)});return}

  else if(a==="pubLink"){pubLink();return}
  else if(a==="pull"){pullAnswers();return}
    else if(a==="closeOv"){$("#ov").classList.remove("on");return}
  render();
});
document.addEventListener("input",e=>{
  const f=e.target.dataset.f;if(!f)return;
  if(f==="rsub"){const r=S.recs.find(x=>x.id===+e.target.dataset.id);r.subject=e.target.value;save();return}
  if(f==="subject"){ui.subject=e.target.value;return}
  if(f==="date"||f==="ym")return;
  ui[f]=+e.target.value;
});
document.addEventListener("change",e=>{
  const f=e.target.dataset.f;
  if(f==="subject"){ui.slots=[];loadMarks();render()}
  else if(f==="date"){ui.date=e.target.value;ui.slots=[];if(ui.date){loadMarks();render()}}
  else if(f==="ym"){ui.ym=e.target.value;animate=false;render()}
});

load();SCH.forEach(w=>{for(let d=0;d<=6;d++){if(!Array.isArray(w[d]))w[d]=["","","",""];while(w[d].length<4)w[d].push("")}});save();loadMarks();render();

</script>
</body>
</html>
