<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07110b"><title>Явка — перекличка</title>
<style>
:root{color-scheme:dark;--bg:#070b08;--card:#101812;--line:#26382b;--ink:#ecf8ee;--mut:#91a397;--green:#70f08b;--red:#ff7777}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0,rgba(65,210,95,.18),transparent 42%),var(--bg);color:var(--ink);font:16px/1.45 system-ui,Segoe UI,sans-serif}.wrap{max-width:620px;margin:auto;padding:22px 16px 48px}.brand{font-weight:800;letter-spacing:.12em;color:var(--green)}h1{font-size:28px;margin:8px 0}.muted{color:var(--mut);font-size:14px}.panel,.lesson{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 12px 35px #0004}label{display:block;color:var(--mut);font-size:13px;margin:4px 0 7px}select,button{font:inherit}select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0b120d;color:var(--ink)}.lesson{padding:14px;margin:10px 0}.time{font-size:12px;color:var(--mut)}.subject{font-weight:750;margin:4px 0}.meta{font-size:13px;color:var(--green)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.choice{border:1px solid var(--line);border-radius:12px;background:#17221a;color:var(--mut);padding:12px 8px;font-weight:700}.choice[aria-pressed=true].yes{background:#174d27;border-color:var(--green);color:#c9ffd2}.choice[aria-pressed=true].no{background:#4a2020;border-color:var(--red);color:#ffe0e0}.primary{width:100%;border:0;border-radius:13px;padding:15px;background:linear-gradient(135deg,#8bffa0,#4bd66c);color:#06150a;font-weight:800;margin-top:12px}.primary:disabled{opacity:.45}.notice{padding:12px;border-radius:12px;background:#15251a;color:#b9e9c2;font-size:14px}.error{color:#ff9999}.hidden{display:none!important}.footer{text-align:center;color:#65776a;font-size:12px;margin-top:20px}
</style></head><body><main class="wrap"><div class="brand">ЯВКА / ONLINE</div><h1>Отметь посещаемость</h1><div id="dateLine" class="muted">Загрузка расписания…</div><section id="app"><div class="panel">Подключаемся к перекличке…</div></section><div class="footer">Данные отправляются старосте через защищённую базу Firebase.</div></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInAnonymously} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const root=document.querySelector('#app');
const date=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=date(),group=new URLSearchParams(location.search).get('group')||'26л-02',sessionId=group+'_'+today;
document.querySelector('#dateLine').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · группа '+group;
let session,students=[],answers={};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){if(!session||!session.open){root.innerHTML='<div class="panel"><div class="notice">Староста ещё не открыл перекличку на сегодня. Попробуй обновить страницу чуть позже.</div></div>';return;}
root.innerHTML=`<div class="panel"><label for="student">Выбери свою фамилию</label><select id="student"><option value="">Выбери себя…</option>${students.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select><p class="muted">Отметь присутствие на каждой паре и отправь ответы один раз.</p></div><div id="lessons">${session.lessons.map((l,i)=>`<article class="lesson"><div class="time">${esc(l.time)} · ${l.slot+1}-я пара</div><div class="subject">${esc(l.subject)}</div><div class="meta">${l.type==='lec'?'Лекция':'Семинар'}${l.room?' · кабинет '+esc(l.room):''}</div><div class="choices"><button class="choice yes" data-i="${i}" data-v="p" aria-pressed="false">Присутствую</button><button class="choice no" data-i="${i}" data-v="a" aria-pressed="false">Отсутствую</button></div></article>`).join('')}</div><button id="send" class="primary" disabled>Отправить отметки</button><div id="msg" class="muted" style="margin-top:10px"></div>`;
const select=root.querySelector('#student'),send=root.querySelector('#send');const update=()=>send.disabled=!select.value||Object.keys(answers).length!==session.lessons.length;
select.addEventListener('change',update);root.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.i;answers[i]=b.dataset.v;root.querySelectorAll(`.choice[data-i="${i}"]`).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));update();}));
send.addEventListener('click',async()=>{send.disabled=true;const msg=root.querySelector('#msg');try{await setDoc(doc(db,'sessions',sessionId,'submissions',auth.currentUser.uid),{uid:auth.currentUser.uid,groupId:group,studentName:select.value,answers:session.lessons.map((l,i)=>({slot:l.slot,subject:l.subject,type:l.type,time:l.time,status:answers[i]})),createdAt:serverTimestamp()});root.innerHTML='<div class="panel"><div class="notice">Готово! Твои отметки отправлены старосте. Спасибо! 🟢</div></div>';}catch(e){msg.className='error';msg.textContent='Не удалось отправить: '+e.message;send.disabled=false;}});
}
try{await signInAnonymously(auth);const [g,s]=await Promise.all([getDoc(doc(db,'publicGroups',group)),getDoc(doc(db,'sessions',sessionId))]);if(!g.exists()){root.innerHTML='<div class="panel error">Список группы ещё не опубликован старостой.</div>';}else if(!s.exists()){root.innerHTML='<div class="panel">Перекличка на сегодня ещё не открыта.</div>';}else{students=g.data().names||[];session=s.data();if(session.expiresAt?.toDate&&session.expiresAt.toDate()<new Date())session.open=false;const existing=await getDoc(doc(db,'sessions',sessionId,'submissions',auth.currentUser.uid));if(existing.exists()){root.innerHTML='<div class="panel"><div class="notice">Ты уже отправил отметки. Повторная отправка с этого браузера не требуется.</div></div>';}else render();}}catch(e){root.innerHTML='<div class="panel error">Ошибка подключения: '+esc(e.message)+'</div>';}
</script></body></html>
